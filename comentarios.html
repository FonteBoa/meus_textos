<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MURAL INTERATIVO — fonteboa</title>
<link href="googleapis.com" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/></head>
<body>
<header><div class="titulo" id="titulo">ficção breve de Luiz Fonte Boa, (1962- )</div></header>
<nav id="nav-menu">
<a href="contos_index.html">índice de contos</a>
<a href="ensaios_index.html">ensaios</a>
<a href="novelas_index.html">novelas</a>
<a href="anotacoes.html">anotações</a>
<a class="active" href="mural_interativo.html">mural interativo</a>
<a class="inicio" href="index.html">início</a>
</nav>
<div class="content-area" id="content-area">
<div class="text-title" id="text-title">MURAL INTERATIVO</div>
<div class="scroll-area">
<div class="mural-container">
<div class="formulario-comentario">
<div class="form-linha">
<label for="autorInput">Nome:</label>
<input id="autorInput" onfocus="restaurarCampo(this, 'Ex: Adélia Prado')" type="text"/>
</div>
<div class="form-linha">
<label for="textoInput">Notas:</label>
<textarea id="textoInput" maxlength="350" onfocus="restaurarCampo(this, 'Digite seu comentário...')" oninput="autoGrown(this)" rows="1"></textarea>
</div>
<div class="btn-linha">
<span class="contador-caracteres" id="contadorMsg">350 caracteres restantes</span>
<button onclick="adicionarComentario()">Enviar</button>
</div>
</div>
<div class="scroll-comentarios" id="scroller-comentarios">
<div class="lista-comentarios" id="lista-comentarios"></div>
</div>
</div>
</div>
</div>
<div class="content-area-fade" id="content-area-fade"></div>
<div class="hero-wrap"><div class="hero-text" id="hero">mural</div></div>
<script>
document.getElementById('autorInput').placeholder = 'Ex: Adélia Prado';
document.getElementById('textoInput').placeholder = 'Digite seu comentário...';

function autoGrown(element) {
  element.style.height = "5px";
  element.style.height = (element.scrollHeight) + "px";
  
  const limiteMaximo = 350;
  const caracteresDigitados = element.value.length;
  const caracteresRestantes = limiteMaximo - caracteresDigitados;
  
  const contadorElemento = document.getElementById('contadorMsg');
  
  if (caracteresRestantes === 0) {
    contadorElemento.textContent = "Limite máximo de caracteres atingido.";
    contadorElemento.classList.add('limite-atingido');
  } else {
    contadorElemento.textContent = `${caracteresRestantes} caracteres restantes`;
    contadorElemento.classList.remove('limite-atingido');
  }
}

function adicionarComentario() {
  const autorInput = document.getElementById('autorInput');
  const textoInput = document.getElementById('textoInput');
  
  const autor = autorInput.value.trim();
  const texto = textoInput.value.trim();
  let erro = false;
  
  if (!autor) {
    autorInput.value = '';
    autorInput.placeholder = 'Por favor, digite seu nome aqui.';
    autorInput.classList.add('campo-erro');
    erro = true;
  }
  
  if (!texto) {
    textoInput.value = '';
    textoInput.placeholder = 'Por favor, escreva o seu comentário.';
    textoInput.classList.add('campo-erro');
    erro = true;
  }
  
  if (erro) return;
  
  const lista = document.getElementById('lista-comentarios');
  const novoItem = document.createElement('span');
  novoItem.className = 'comentario-bloco';
  
  novoItem.innerHTML = `
    <span class="autor-comentario" onclick="responderAutor('${autor}')">${autor}</span><span class="data-comentario">agora mesmo</span>
    <span class="texto-comentario">${texto}</span>
  `;
  
  lista.appendChild(novoItem);
  
  autorInput.value = '';
  autorInput.placeholder = 'Ex: Adélia Prado';
  autorInput.classList.remove('campo-erro');
  
  textoInput.value = '';
  textoInput.placeholder = 'Digite seu comentário...';
  textoInput.classList.remove('campo-erro');
  textoInput.style.height = "38px"; 
  
  const contadorElemento = document.getElementById('contadorMsg');
  contadorElemento.textContent = "350 caracteres restantes";
  contadorElemento.classList.remove('limite-atingido');
}

function restaurarCampo(element, placeholderPadrao) {
  if (element.classList.contains('campo-erro')) {
    element.classList.remove('campo-erro');
    element.placeholder = placeholderPadrao;
  }
}

function responderAutor(nomeAutor) {
  const campoTexto = document.getElementById('textoInput');
  restaurarCampo(campoTexto, 'Digite seu comentário...');
  campoTexto.value = `@${nomeAutor} ` + campoTexto.value;
  autoGrown(campoTexto);
  campoTexto.focus();
}

function fitTitulo() {
  const el = document.getElementById("titulo");
  el.style.fontSize = "100px";
  const header = document.querySelector("header");
  const headerStyle = window.getComputedStyle(header);
  const marginLeft = parseInt(headerStyle.paddingLeft) || 36;
  const margin = marginLeft * 2;
  const scale = (window.innerWidth - margin) / el.scrollWidth;
  el.style.fontSize = (100 * scale) + "px";
}
function fitTextTitle() {
  const el = document.getElementById('text-title');
  if (!el) return;
  el.style.fontSize = '1.8rem';
  const container = el.parentElement;
  const available = container.offsetWidth;
  if (el.scrollWidth > available) {
    const scale = available / el.scrollWidth;
    const newSize = Math.max(0.9, 1.8 * scale);
    el.style.fontSize = newSize + 'rem';
  }
}
function positionFade() {
  const scrollArea = document.querySelector('.scroll-area');
  const fade = document.getElementById('content-area-fade');
  if (!scrollArea || !fade) return;
  const rect = scrollArea.getBoundingClientRect();
  fade.style.top = (rect.bottom - 80) + 'px';
}
function fitHero() {
  const el = document.getElementById("hero");
  el.style.fontSize = "100px";
  const scale = (window.innerWidth * 1.12) / el.scrollWidth;
  el.style.fontSize = (100 * scale) + "px";
}

function positionContentArea() {
  const nav = document.getElementById('nav-menu');
  const lastLink = nav.querySelector('a:last-child');
  const lastLinkRect = lastLink.getBoundingClientRect();
  const contentArea = document.getElementById('content-area');
  const offset = window.innerWidth <= 600 ? 10 : 50; 
  contentArea.style.top = (lastLinkRect.bottom + offset) + 'px';
}

document.fonts.ready.then(() => { fitTitulo(); fitHero(); positionContentArea(); fitTextTitle(); positionFade(); });
window.addEventListener("resize", () => { fitTitulo(); fitHero(); positionContentArea(); fitTextTitle(); positionFade(); });
document.querySelectorAll('nav a').forEach(link => {
  link.addEventListener('click', function(e) {
    if (this.href) { e.preventDefault(); window.location.href = this.href; }
  });
});

const scrollerComentarios = document.getElementById('scroller-comentarios');
const STEP = 120;
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); scrollerComentarios.scrollBy({ top: STEP, behavior: 'smooth' }); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); scrollerComentarios.scrollBy({ top: -STEP, behavior: 'smooth' }); }
});
</script>
</body></html>
