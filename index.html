<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>fonteboa</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet"/>
</head>
<body>

<header><div class="titulo" id="titulo"></div></header>

<nav id="nav-menu"></nav>

<div class="hero-wrap">
  <div class="hero-text" id="hero">fonteboa</div>
</div>

<script src="layout_master.js"></script>
<script>
  function fitHero() {
    const el = document.getElementById('hero');
    if (!el) return;
    el.style.fontSize = '100px';
    el.style.fontSize = (100 * (window.innerWidth * 1.12) / el.scrollWidth) + 'px';
  }

  document.fonts.ready.then(() => {
    initLayout('inicio', 'home');
    fitHero();
  });

  window.addEventListener('resize', fitHero);
</script>
<div id="comments"></div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
<script src="comments.js"></script>
</body>
</html>
